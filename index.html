<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عيد ميلاد سمية ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#080008;
    color:white;
}

/* =========================
   المشاهد
========================= */

.scene{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.scene.active{
    display:flex;
}

/* =========================
   الصفحة الأولى
========================= */

#start{
    background:
    radial-gradient(circle at center,#650d32,#17000c 55%,#030003);
    flex-direction:column;
}

/* النجوم */

.star{
    position:absolute;
    color:white;
    animation:twinkle 1.5s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
    }
    to{
        opacity:1;
    }
}

/* الورود */

.rose{
    position:absolute;
    font-size:42px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    50%{
        transform:translateY(-15px);
    }
}

/* العنوان */

.small{
    font-size:15px;
    letter-spacing:4px;
    color:#ff9db5;
    margin-bottom:20px;
}

h1{
    font-size:42px;
    margin-bottom:35px;
    text-shadow:
    0 0 15px #ff174f,
    0 0 40px #ff174f;
}

/* الزر */

#startButton{
    position:relative;
    z-index:100;

    border:2px solid #ff4c75;
    border-radius:50px;

    padding:20px 40px;

    background:#5c0b2d;

    color:white;

    font-size:25px;

    cursor:pointer;

    box-shadow:
    0 0 15px #ff174f,
    0 0 45px #ff174f;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.07);
        box-shadow:
        0 0 30px #ff174f,
        0 0 70px #ff174f;
    }
}

/* =========================
   المشهد الثاني
========================= */

#heartScene{
    background:
    radial-gradient(circle,#45001f,#030003);
}

#heart{
    font-size:150px;
    color:#ff174f;

    animation:
    heartAppear 3s ease forwards,
    heartBeat 1.2s infinite 3s;

    text-shadow:
    0 0 20px #ff174f,
    0 0 60px #ff174f;
}

@keyframes heartAppear{
    from{
        transform:scale(0);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes heartBeat{
    50%{
        transform:scale(1.1);
    }
}

.heartText{
    position:absolute;
    margin-top:250px;

    font-size:35px;

    text-shadow:
    0 0 15px #ff174f;
}

/* =========================
   Matrix
========================= */

#matrixScene{
    background:black;
}

#matrix{
    position:absolute;
    inset:0;
}

#number{
    position:relative;
    z-index:5;

    font-size:180px;
    font-weight:bold;

    color:white;

    text-shadow:
    0 0 20px white,
    0 0 60px white;
}

/* =========================
   عيد الميلاد
========================= */

#birthday{
    background:
    radial-gradient(circle,#650d32,#030003);
    flex-direction:column;
}

.birthday{
    font-size:55px;

    text-shadow:
    0 0 20px #ff174f,
    0 0 60px #ff174f;
}

.message{
    margin-top:30px;
    font-size:25px;
    color:#ffd6df;
}

/* =========================
   النهاية
========================= */

#final{
    background:
    radial-gradient(circle,#650d32,#030003);
    flex-direction:column;
}

.final{
    font-size:60px;

    text-shadow:
    0 0 20px #ff174f,
    0 0 60px #ff174f;
}

.date{
    margin-top:25px;
    font-size:30px;
}

/* الهاتف */

@media(max-width:600px){

    h1{
        font-size:30px;
    }

    #startButton{
        font-size:21px;
        padding:18px 30px;
    }

    #heart{
        font-size:110px;
    }

    .birthday{
        font-size:35px;
    }

    .final{
        font-size:40px;
    }

}
</style>
</head>

<body>

<!-- =========================
     الصفحة الأولى
========================= -->

<section id="start" class="scene active">

    <div class="star" style="top:10%;left:15%">✦</div>
    <div class="star" style="top:20%;left:80%">✦</div>
    <div class="star" style="top:70%;left:20%">✦</div>
    <div class="star" style="top:80%;left:75%">✦</div>
    <div class="star" style="top:40%;left:8%">✦</div>
    <div class="star" style="top:50%;left:90%">✦</div>

    <div class="rose" style="top:12%;left:8%">🌹</div>
    <div class="rose" style="top:15%;right:8%">🌹</div>
    <div class="rose" style="bottom:12%;left:10%">🌹</div>
    <div class="rose" style="bottom:15%;right:10%">🌹</div>

    <div class="small">
        A SPECIAL BIRTHDAY GIFT
    </div>

    <h1>
        عيد ميلاد سعيد سمية ❤️
    </h1>

    <!-- هذا هو الزر -->
    <button id="startButton">
        اضغطي هنا ❤️
    </button>

</section>


<!-- =========================
     المشهد الثاني
========================= -->

<section id="heartScene" class="scene">

    <div id="heart">
        ❤️
    </div>

    <div class="heartText">
        Soumia ❤️
    </div>

</section>


<!-- =========================
     Matrix
========================= -->

<section id="matrixScene" class="scene">

    <canvas id="matrix"></canvas>

    <div id="number">
        3
    </div>

</section>


<!-- =========================
     عيد الميلاد
========================= -->

<section id="birthday" class="scene">

    <div class="birthday">
        Happy Birthday, Soumia ❤️
    </div>

    <div class="message">
        أتمنى أن تظل ابتسامتكِ دائمًا أكثر إشراقًا من النجوم ✨❤️
    </div>

</section>


<!-- =========================
     النهاية
========================= -->

<section id="final" class="scene">

    <div class="final">
        Happy Birthday, Soumia ❤️
    </div>

    <div class="date">
        15 October 2010 🎂
    </div>

</section>


<script>

/* ==================================
   زر اضغطي هنا
================================== */

const button =
document.getElementById("startButton");


button.addEventListener("click", function(){

    /* إخفاء الصفحة الأولى */
    document.getElementById("start")
    .classList.remove("active");

    /* إظهار المشهد الثاني */
    document.getElementById("heartScene")
    .classList.add("active");

    /* بعد 7 ثواني Matrix */
    setTimeout(function(){

        document.getElementById("heartScene")
        .classList.remove("active");

        document.getElementById("matrixScene")
        .classList.add("active");

        startMatrix();

    },7000);

});


/* ==================================
   Matrix
================================== */

const canvas =
document.getElementById("matrix");

const ctx =
canvas.getContext("2d");

let animation;

const characters =
"LOVE YOU ❤️ ♥ ✦ 010101";

let drops=[];


function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


function startMatrix(){

    drops=[];

    const columns =
    Math.floor(canvas.width/18);

    for(let i=0;i<columns;i++){

        drops[i] =
        Math.random()*canvas.height/18;

    }

    function draw(){

        ctx.fillStyle =
        "rgba(0,0,0,0.15)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle =
        "white";

        ctx.font =
        "16px Arial";

        for(let i=0;i<drops.length;i++){

            const char =
            characters[
                Math.floor(
                    Math.random()*characters.length
                )
            ];

            const x =
            i*18;

            const y =
            drops[i]*18;

            ctx.fillText(
                char,
                x,
                y
            );

            drops[i]++;

            if(y>canvas.height){

                drops[i]=0;

            }

        }

        animation =
        requestAnimationFrame(draw);

    }

    draw();


    /* الرقم 3 */

    document.getElementById("number")
    .textContent="3";


    setTimeout(function(){

        document.getElementById("number")
        .textContent="2";

    },2000);


    setTimeout(function(){

        document.getElementById("number")
        .textContent="1";

    },4000);


    /* بعد 6 ثواني نذهب لعيد الميلاد */

    setTimeout(function(){

        cancelAnimationFrame(animation);

        document.getElementById("matrixScene")
        .classList.remove("active");

        document.getElementById("birthday")
        .classList.add("active");

    },6000);


    /* بعد 5 ثواني للنهاية */

    setTimeout(function(){

        document.getElementById("birthday")
        .classList.remove("active");

        document.getElementById("final")
        .classList.add("active");

    },11000);

}

</script>

</body>
</html>
